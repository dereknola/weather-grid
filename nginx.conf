limit_req_zone $binary_remote_addr zone=weather_pages:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=weather_connections:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    limit_req_status 429;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location ~* /(?:index\.html)?$ {
        limit_req zone=weather_pages burst=15 nodelay;
        limit_conn weather_connections 20;
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        limit_req zone=weather_pages burst=15 nodelay;
        limit_conn weather_connections 20;
        try_files $uri /index.html;
    }
}