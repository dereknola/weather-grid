<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Teal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FB8B0" />
      <stop offset="100%" stop-color="#185250" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />

  <!-- Outer Grid Frame -->
  <rect x="116" y="116" width="280" height="280" rx="36" fill="none" stroke="#FFFFFF" stroke-width="16" />

  <!-- Grid Dividers -->
  <line x1="256" y1="116" x2="256" y2="396" stroke="#FFFFFF" stroke-width="14" />
  <line x1="116" y1="256" x2="396" y2="256" stroke="#FFFFFF" stroke-width="14" />

  <!-- Quadrant 1: Sun (Top-Left) -->
  <g transform="translate(186, 186)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" />
    <line x1="0" y1="-30" x2="0" y2="-24" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="24" x2="0" y2="30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="-30" y1="0" x2="-24" y2="0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="24" y1="0" x2="30" y2="0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="-21" y1="-21" x2="-17" y2="-17" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="17" y1="17" x2="21" y2="21" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="-21" y1="21" x2="-17" y2="17" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="17" y1="-17" x2="21" y2="-21" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Quadrant 2: Rain (Top-Right) -->
  <g transform="translate(326, 178)">
    <path d="M -16 4 h 32 a 10 10 0 0 0 0 -20 a 14 14 0 0 0 -26 -5 a 10 10 0 0 0 -6 25 z" fill="#FFFFFF" />
    <line x1="-10" y1="12" x2="-15" y2="24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="2" y1="12" x2="-3" y2="24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="14" y1="12" x2="9" y2="24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Quadrant 3: Wind & Cloud (Bottom-Left) -->
  <g transform="translate(186, 316)">
    <path d="M -16 -4 h 32 a 10 10 0 0 0 0 -20 a 14 14 0 0 0 -26 -5 a 10 10 0 0 0 -6 25 z" fill="#FFFFFF" />
    <path d="M -20 8 H 10 A 5 5 0 1 0 10 -2" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M -14 17 H 2 A 4 4 0 1 0 2 9" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Quadrant 4: Moon & Star (Bottom-Right) -->
  <g transform="translate(326, 326)">
    <path d="M 6 -20 A 18 18 0 1 0 20 6 A 20 20 0 0 1 6 -20 Z" fill="#FFFFFF" />
    <path d="M 14 -20 C 14 -16 12 -14 8 -14 C 12 -14 14 -12 14 -8 C 14 -12 16 -14 20 -14 C 16 -14 14 -16 14 -20 Z" fill="#FFFFFF" />
  </g>
</svg>
